<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" width="720" height="160">
  <defs>
    <!-- Left Entity Loop Gradient (Sapphire to Electric Blue) -->
    <linearGradient id="logoLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Right Entity Loop Gradient (Emerald to Mint) -->
    <linearGradient id="logoRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flow Gradient -->
    <linearGradient id="logoFlowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="logoFlowGrad2" x1="100%" y1="100%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Group (Centered around x=85, y=80) -->
  <g transform="translate(-15, 0)">
    <!-- Ambient Glow behind symbol -->
    <circle cx="65" cy="80" r="38" fill="#2563eb" opacity="0.22" filter="url(#logoGlow)" />
    <circle cx="125" cy="80" r="38" fill="#10b981" opacity="0.20" filter="url(#logoGlow)" />

    <!-- Orbital Flow Lines -->
    <path d="M 60 52 C 78 35, 112 35, 130 52" fill="none" stroke="url(#logoFlowGrad1)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 3" />
    <polygon points="134,56 134,48 141,53" fill="#34d399" />

    <path d="M 130 108 C 112 125, 78 125, 60 108" fill="none" stroke="url(#logoFlowGrad2)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 3" />
    <polygon points="56,104 56,112 49,107" fill="#38bdf8" />

    <!-- Entity A Hexagon -->
    <polygon points="62,48 88,63 88,97 62,112 36,97 36,63" 
             fill="#0f172a" stroke="url(#logoLeftGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 50 96 L 50 72 L 62 62 L 74 72 L 74 96 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="55" y="76" width="5" height="6" rx="1" fill="#38bdf8" />
    <rect x="64" y="76" width="5" height="6" rx="1" fill="#38bdf8" />

    <!-- Entity B Hexagon -->
    <polygon points="128,48 154,63 154,97 128,112 102,97 102,63" 
             fill="#0f172a" stroke="url(#logoRightGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 116 96 L 116 72 L 128 62 L 140 72 L 140 96 Z" fill="#1e293b" stroke="#34d399" stroke-width="1.8" />
    <rect x="121" y="76" width="5" height="6" rx="1" fill="#34d399" />
    <rect x="130" y="76" width="5" height="6" rx="1" fill="#34d399" />

    <!-- Central Nexus Diamond -->
    <circle cx="95" cy="80" r="16" fill="#0f172a" stroke="#818cf8" stroke-width="2.5" />
    <polygon points="95,69 104,80 95,91 86,80" fill="#ffffff" filter="url(#logoGlow)" />
  </g>

  <!-- Typography Brand Group -->
  <g transform="translate(180, 0)">
    <!-- Top Wordmark -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="34" font-weight="900" letter-spacing="1.5" fill="#ffffff">
      INTER-COMPANY
    </text>

    <!-- Sub Wordmark -->
    <text x="2" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', Arial, sans-serif" 
          font-size="28" font-weight="700" letter-spacing="5" fill="url(#textGrad)">
      TRANSACTIONS
    </text>

    <!-- Platform & Compatibility Tagline Pill -->
    <g transform="translate(2, 114)">
      <rect x="0" y="0" width="375" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Green Verified Dot -->
      <circle cx="14" cy="13" r="4.5" fill="#10b981" />
      <text x="26" y="17.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="11" font-weight="700" letter-spacing="1.2" fill="#94a3b8">
        FOR ERPNEXT <tspan fill="#38bdf8">v14</tspan> • <tspan fill="#60a5fa">v15</tspan> • <tspan fill="#34d399">v16 (READY)</tspan>
      </text>
    </g>
  </g>
</svg>
