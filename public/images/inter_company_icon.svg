<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Left Entity Loop Gradient (Sapphire to Electric Blue) -->
    <linearGradient id="leftNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Right Entity Loop Gradient (Emerald to Mint) -->
    <linearGradient id="rightNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Flow Gradient (Sync Path) -->
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="flowGrad2" x1="100%" y1="100%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center Diamond Gradient -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowIntense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Background Tech Grid Matrix (Subtle) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="96" y1="64" x2="96" y2="448" />
    <line x1="176" y1="64" x2="176" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" stroke-dasharray="4 4" />
    <line x1="336" y1="64" x2="336" y2="448" />
    <line x1="416" y1="64" x2="416" y2="448" />
    
    <line x1="64" y1="96" x2="448" y2="96" />
    <line x1="64" y1="176" x2="448" y2="176" />
    <line x1="64" y1="256" x2="448" y2="256" stroke-dasharray="4 4" />
    <line x1="64" y1="336" x2="448" y2="336" />
    <line x1="64" y1="416" x2="448" y2="416" />
  </g>

  <!-- Ambient Glow Behind Symbols -->
  <circle cx="180" cy="256" r="90" fill="#2563eb" opacity="0.25" filter="url(#glowIntense)" />
  <circle cx="332" cy="256" r="90" fill="#10b981" opacity="0.22" filter="url(#glowIntense)" />
  <circle cx="256" cy="256" r="60" fill="#6366f1" opacity="0.30" filter="url(#glowIntense)" />

  <!-- Outer Orbiting Synchronous Tracks -->
  <!-- Top Forward Flux (Company A -> Company B) -->
  <path d="M 170 190 C 210 145, 302 145, 342 190" fill="none" stroke="url(#flowGrad1)" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 6" />
  <!-- Arrow Head A -> B -->
  <polygon points="348,198 348,182 360,192" fill="#34d399" />

  <!-- Bottom Return Flux (Company B -> Company A) -->
  <path d="M 342 322 C 302 367, 210 367, 170 322" fill="none" stroke="url(#flowGrad2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 6" />
  <!-- Arrow Head B -> A -->
  <polygon points="164,314 164,330 152,320" fill="#38bdf8" />

  <!-- Left Entity Node (Company A - Sales / Source) -->
  <g id="entity-a">
    <!-- Hexagon Outer Shell -->
    <polygon points="176,170 236,204 236,274 176,308 116,274 116,204" 
             fill="#0f172a" stroke="url(#leftNodeGrad)" stroke-width="8" stroke-linejoin="round" />
    <!-- Inner Building / Enterprise Icon -->
    <path d="M 148 270 L 148 220 L 176 200 L 204 220 L 204 270 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Ledger Windows -->
    <rect x="160" y="226" width="10" height="12" rx="2" fill="#38bdf8" />
    <rect x="182" y="226" width="10" height="12" rx="2" fill="#38bdf8" />
    <rect x="160" y="246" width="10" height="12" rx="2" fill="#38bdf8" />
    <rect x="182" y="246" width="10" height="12" rx="2" fill="#38bdf8" />
    <!-- Pillar Accent -->
    <circle cx="176" cy="170" r="7" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="116" cy="239" r="6" fill="#2563eb" />
    <circle cx="176" cy="308" r="6" fill="#1d4ed8" />
  </g>

  <!-- Right Entity Node (Company B - Purchase / Mirror) -->
  <g id="entity-b">
    <!-- Hexagon Outer Shell -->
    <polygon points="336,170 396,204 396,274 336,308 276,274 276,204" 
             fill="#0f172a" stroke="url(#rightNodeGrad)" stroke-width="8" stroke-linejoin="round" />
    <!-- Inner Building / Enterprise Icon -->
    <path d="M 308 270 L 308 220 L 336 200 L 364 220 L 364 270 Z" fill="#1e293b" stroke="#34d399" stroke-width="3" />
    <!-- Ledger Windows -->
    <rect x="320" y="226" width="10" height="12" rx="2" fill="#34d399" />
    <rect x="342" y="226" width="10" height="12" rx="2" fill="#34d399" />
    <rect x="320" y="246" width="10" height="12" rx="2" fill="#34d399" />
    <rect x="342" y="246" width="10" height="12" rx="2" fill="#34d399" />
    <!-- Pillar Accent -->
    <circle cx="336" cy="170" r="7" fill="#34d399" filter="url(#glow)" />
    <circle cx="396" cy="239" r="6" fill="#10b981" />
    <circle cx="336" cy="308" r="6" fill="#059669" />
  </g>

  <!-- Central Nexus Core (Netting, Transfer Pricing & Real-time Settlement) -->
  <g id="central-nexus">
    <!-- Connecting Bridge Lines -->
    <line x1="236" y1="239" x2="276" y2="239" stroke="#6366f1" stroke-width="6" stroke-linecap="round" />
    
    <!-- Outer Balance Ring -->
    <circle cx="256" cy="239" r="34" fill="#0f172a" stroke="#818cf8" stroke-width="4" filter="url(#glow)" />
    
    <!-- Central Netting Equilibrium Diamond -->
    <polygon points="256,217 274,239 256,261 238,239" fill="url(#diamondGrad)" filter="url(#glow)" />
    
    <!-- Sync Pulse Particles -->
    <circle cx="256" cy="239" r="5" fill="#ffffff" />
  </g>

  <!-- Bottom Wordmark Badge -->
  <g transform="translate(0, 420)">
    <!-- Pill Container -->
    <rect x="116" y="0" width="280" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="256" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="13" font-weight="700" letter-spacing="2.5" fill="#94a3b8" text-anchor="middle">
      ERP<tspan fill="#38bdf8">NEXT</tspan> <tspan fill="#64748b">•</tspan> v15 • v16
    </text>
  </g>
</svg>
