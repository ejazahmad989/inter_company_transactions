<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="accentText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="640" fill="url(#bannerBg)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="180" fill="#2563eb" opacity="0.18" filter="url(#bannerGlow)" />
  <circle cx="1100" cy="200" r="220" fill="#10b981" opacity="0.15" filter="url(#bannerGlow)" />
  <circle cx="640" cy="500" r="240" fill="#6366f1" opacity="0.12" filter="url(#bannerGlow)" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" />
    </pattern>
    <rect width="1280" height="640" fill="url(#grid)" />
  </g>

  <!-- Left Hero Column: Brand & Icon (x: 80 to 520) -->
  <g transform="translate(80, 80)">
    <!-- App Icon Card Squircle -->
    <rect x="0" y="0" width="160" height="160" rx="36" fill="#0f172a" stroke="url(#cardBorder)" stroke-width="2.5" filter="url(#bannerGlow)" />
    
    <!-- Miniaturized Interlocking Symbol inside 160x160 Card -->
    <g transform="translate(10, 10) scale(0.273)">
      <!-- Left Hexagon -->
      <polygon points="176,170 236,204 236,274 176,308 116,274 116,204" 
               fill="#0f172a" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round" />
      <path d="M 148 270 L 148 220 L 176 200 L 204 220 L 204 270 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="4" />
      <!-- Right Hexagon -->
      <polygon points="336,170 396,204 396,274 336,308 276,274 276,204" 
               fill="#0f172a" stroke="#34d399" stroke-width="10" stroke-linejoin="round" />
      <path d="M 308 270 L 308 220 L 336 200 L 364 220 L 364 270 Z" fill="#1e293b" stroke="#34d399" stroke-width="4" />
      <!-- Central Nexus -->
      <circle cx="256" cy="239" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="6" />
      <polygon points="256,220 272,239 256,258 240,239" fill="#ffffff" />
      <!-- Orbital Flow Lines -->
      <path d="M 170 190 C 210 145, 302 145, 342 190" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 8" />
      <path d="M 342 322 C 302 367, 210 367, 170 322" fill="none" stroke="#34d399" stroke-width="10" stroke-linecap="round" stroke-dasharray="14 8" />
    </g>

    <!-- App Title -->
    <text x="190" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="44" font-weight="900" letter-spacing="1" fill="#ffffff">
      Inter-Company Transactions
    </text>

    <!-- Tagline Subtitle -->
    <text x="192" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="20" font-weight="600" fill="url(#accentText)">
      Autonomous Mirroring, Transfer Pricing &amp; Multi-Site Sync for ERPNext
    </text>

    <!-- Compatibility Verified Pill Header -->
    <g transform="translate(192, 118)">
      <rect x="0" y="0" width="390" height="32" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="30" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
            font-size="13" font-weight="700" fill="#34d399">
        OFFICIALLY CERTIFIED FOR ERPNEXT v14 • v15 • v16
      </text>
    </g>
  </g>

  <!-- Feature Grid Cards (Bottom Section: y: 280 to 570) -->
  <!-- Card 1: Autonomous Mirroring -->
  <g transform="translate(80, 270)">
    <rect width="265" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1" />
    <circle cx="36" cy="38" r="18" fill="#2563eb" fill-opacity="0.25" />
    <text x="36" y="44" font-size="18" text-anchor="middle">⚡</text>
    <text x="66" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Auto-Mirroring
    </text>
    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" width="225">
      Instant reciprocal flows:
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      • Sales Order ⇄ Purchase Order
    </text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      • Sales Inv ⇄ Purchase Inv
    </text>
    <text x="20" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">
      • Delivery Note ⇄ Purchase Rec
    </text>
  </g>

  <!-- Card 2: Transfer Pricing & FX -->
  <g transform="translate(375, 270)">
    <rect width="265" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1" />
    <circle cx="36" cy="38" r="18" fill="#10b981" fill-opacity="0.25" />
    <text x="36" y="44" font-size="18" text-anchor="middle">🛡️</text>
    <text x="66" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Transfer Pricing
    </text>
    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      OECD arm's-length compliance:
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">
      • Cost-Plus, Resale, Price Lists
    </text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">
      • Multi-currency auto-conversion
    </text>
    <text x="20" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399">
      • Effective date validity rules
    </text>
  </g>

  <!-- Card 3: Remote Multi-Site Sync -->
  <g transform="translate(670, 270)">
    <rect width="265" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1" />
    <circle cx="36" cy="38" r="18" fill="#6366f1" fill-opacity="0.25" />
    <text x="36" y="44" font-size="18" text-anchor="middle">🌐</text>
    <text x="66" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Multi-Site Sync
    </text>
    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      Cross-instance federation:
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">
      • Cross-server REST token auth
    </text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">
      • HMAC-SHA256 signature checks
    </text>
    <text x="20" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#818cf8">
      • In-app ping &amp; firewall test tool
    </text>
  </g>

  <!-- Card 4: Netting & Consolidation -->
  <g transform="translate(965, 270)">
    <rect width="235" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1" />
    <circle cx="36" cy="38" r="18" fill="#ec4899" fill-opacity="0.25" />
    <text x="36" y="44" font-size="18" text-anchor="middle">⚖️</text>
    <text x="66" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      Netting &amp; Elim
    </text>
    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
      Multi-entity financial close:
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">
      • Bilateral &amp; Multilateral netting
    </text>
    <text x="20" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">
      • Auto elimination journal entries
    </text>
    <text x="20" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f472b6">
      • Dispute triage &amp; credit notes
    </text>
  </g>

  <!-- Bottom Trust Bar (y: 475 to 580) -->
  <g transform="translate(80, 475)">
    <!-- Main container -->
    <rect width="1120" height="90" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Item 1: Marketplace Ready -->
    <g transform="translate(35, 30)">
      <circle cx="15" cy="15" r="15" fill="#38bdf8" fill-opacity="0.15" />
      <text x="15" y="21" font-size="14" text-anchor="middle" fill="#38bdf8">★</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        Frappe Marketplace Ready
      </text>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        Turnkey setup, full docs &amp; PDF guide
      </text>
    </g>

    <!-- Item 2: Safe Migrations -->
    <g transform="translate(420, 30)">
      <circle cx="15" cy="15" r="15" fill="#10b981" fill-opacity="0.15" />
      <text x="15" y="21" font-size="14" text-anchor="middle" fill="#10b981">✓</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        Zero Conflict Architecture
      </text>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        Non-destructive hooks &amp; idempotent patches
      </text>
    </g>

    <!-- Item 3: Multi-language -->
    <g transform="translate(805, 30)">
      <circle cx="15" cy="15" r="15" fill="#818cf8" fill-opacity="0.15" />
      <text x="15" y="21" font-size="14" text-anchor="middle" fill="#818cf8">🌍</text>
      <text x="40" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
        Global Enterprise Reach
      </text>
      <text x="40" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">
        English, Français, Español &amp; العربية
      </text>
    </g>
  </g>
</svg>
